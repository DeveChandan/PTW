<!doctype html>
<html lang="en" class="m-0 p-0">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="https://gfl.co.in/assets/images/New_GFL-Logo29.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GFL ChemSafe | Permit To Work (PTW) Enterprise System</title>

    <!-- Corporate Typography: Plus Jakarta Sans (Headings), Inter (Body UI), JetBrains Mono (Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- SAP UI5 Web Components baseline configuration (SAP Horizon Light Theme) -->
    <script data-id="sap-ui-config" type="application/json">
      {
        "theme": "sap_horizon"
      }
    </script>

    <!-- SAP NetWeaver BSP Server-side User Injection (evaluates when served via SAP BSP runtime) -->
    <script>
      try {
        var rawSapUser = '<%= sy-uname %>';
        if (rawSapUser && rawSapUser.indexOf('<%') === -1 && rawSapUser.trim() !== '') {
          window.SAP_CURRENT_USER = rawSapUser.trim();
        }
        var rawSapClient = '<%= sy-mandt %>';
        if (rawSapClient && rawSapClient.indexOf('<%') === -1 && rawSapClient.trim() !== '') {
          window.SAP_CURRENT_CLIENT = rawSapClient.trim();
        }
      } catch (e) {}
    </script>
  </head>
  <body class="text-[#0b1c30] antialiased m-0 p-0 font-sans selection:bg-[#006398] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
